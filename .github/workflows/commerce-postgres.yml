name: Commerce PostgreSQL clean rebuild
on:
  push:
    paths: ['schema/pgsql/**', 'integrations/commerce/**', 'n8n/workflows/MushroomProcess - Commercial Catalog Snapshot - PGSQL.json', '.github/workflows/commerce-postgres.yml']
  pull_request:
    paths: ['schema/pgsql/**', 'integrations/commerce/**', 'n8n/workflows/MushroomProcess - Commercial Catalog Snapshot - PGSQL.json', '.github/workflows/commerce-postgres.yml']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: commerce_test
          POSTGRES_USER: commerce_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U commerce_test -d commerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: commerce_test
      PGDATABASE: commerce_test
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild without production CSV data
        shell: bash
        run: |
          set -euo pipefail
          for file in schema/pgsql/0*.sql; do
            if [[ "$file" == *031_remove_legacy_public_links.sql ]]; then
              psql -Atc "SELECT c.relname, md5(trim(regexp_replace(pg_get_viewdef(c.oid, true), '[[:space:]]+', ' ', 'g'))) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('vc_lots','vc_products','vc_print_queue') ORDER BY c.relname"
            fi
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Seed synthetic lookup definitions
        run: psql -v ON_ERROR_STOP=1 -f schema/pgsql/tests/commerce_ci_seed.sql
      - name: Inventory, compatibility and legacy-view regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in schema/pgsql/tests/026* schema/pgsql/tests/027* schema/pgsql/tests/031* schema/pgsql/tests/041*.sql schema/pgsql/tests/042*.sql schema/pgsql/tests/044*.sql schema/pgsql/tests/045*.sql schema/pgsql/tests/046*.sql schema/pgsql/tests/047*.sql schema/pgsql/tests/048*.sql schema/pgsql/tests/050*.sql schema/pgsql/tests/051*.sql schema/pgsql/tests/052*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: python3 schema/pgsql/tests/052_commerce_concurrency.py
      - run: node n8n/tests/ecwid_catalog_sync_pgsql_smoke.js
      - run: node n8n/tests/ecwid_order_updated_pgsql_smoke.js
      - run: node n8n/tests/fulfillment_order_visibility_smoke.js

  production-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix /tmp/print-test-deps --no-save --ignore-scripts --no-audit --no-fund dotenv axios pdfkit qrcode
      - name: Production Appsmith, workflow and label contracts
        env:
          NODE_PATH: /tmp/print-test-deps/node_modules
        run: |
          set -euo pipefail
          for file in appsmith/*smoke.js n8n/tests/*smoke.js print-daemon/tests/*smoke*; do
            node "$file"
          done
